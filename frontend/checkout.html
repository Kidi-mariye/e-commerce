<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - EthioMarket</title>
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <h2 class="logo">EthioMarket</h2>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links">
        <li><a href="/frontend/index.html">Home</a></li>
        <li><a href="/frontend/products.html">Products</a></li>
        <li><a href="/frontend/cart.html">Cart <span class="nav-cart-badge" data-cart-count>0</span></a></li>
      </ul>
    </nav>

    <section class="checkout">
      <h2>Checkout</h2>

      <div class="checkout-progress" id="checkout-progress">
        <div class="checkout-step is-active" data-step="1">
          <strong>Step 1</strong>
          <span>Shipping</span>
        </div>
        <div class="checkout-step" data-step="2">
          <strong>Step 2</strong>
          <span>Review</span>
        </div>
        <div class="checkout-step" data-step="3">
          <strong>Step 3</strong>
          <span>Complete</span>
        </div>
      </div>

      <div class="checkout-container">
        <form id="checkout-form" class="checkout-form">
          <h3>Shipping Details</h3>

          <input type="text" id="name" placeholder="Full Name" required />
          <input type="text" id="address" placeholder="Address" required />
          <input type="tel" id="phone" placeholder="Phone Number" required />

          <h3>Payment Method</h3>
          <label class="label">
            <input type="radio" name="payment" checked />
            Cash on Delivery
          </label>

          <button type="submit" class="btn">Place Order</button>
        </form>

        <div class="order-summary">
          <h3>Order Summary</h3>
          <div id="summary-items"></div>
          <h4>Total: <span id="summary-total">0</span> Birr</h4>
        </div>
      </div>
    </section>

    <script src="/frontend/app.js"></script>
  </body>
</html>
