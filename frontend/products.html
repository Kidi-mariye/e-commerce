<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Products - EthioMarket</title>
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>
  <body>
    <!-- Navbar (same as index.html) -->
    <nav class="navbar">
      <h2 class="logo">EthioMarket</h2>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links">
        <li><a href="/frontend/index.html">Home</a></li>
        <li><a href="/frontend/products.html">Products</a></li>
        <li><a href="/frontend/cart.html">Cart <span class="nav-cart-badge" data-cart-count>0</span></a></li>
        <li><a href="/frontend/login.html">Login</a></li>
      </ul>
    </nav>

    <section class="all-products">
      <h2>All Products</h2>

      <div class="category-hero-grid">
        <article class="category-hero category-electronics">
          <p class="eyebrow">Electronics</p>
          <h3>Performance-oriented devices for productivity and daily operations.</h3>
        </article>
        <article class="category-hero category-fashion">
          <p class="eyebrow">Fashion</p>
          <h3>Functional style products with comfort-driven essentials.</h3>
        </article>
        <article class="category-hero category-accessories">
          <p class="eyebrow">Accessories</p>
          <h3>Practical accessories designed to improve everyday convenience.</h3>
        </article>
      </div>

      <div class="filter-container">
        <input type="text" id="search-input" placeholder="Search products..." />
        <select id="category-filter" aria-label="Filter products by category">
          <option value="all">All Categories</option>
        </select>
      </div>

      <div id="products-container" class="product-grid">
        <!-- JS will load products here -->
      </div>
    </section>


    <!-- Script: correct path (app.js is in the frontend root) -->
    <script src="/frontend/app.js"></script>
  </body>
</html>
